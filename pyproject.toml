[tool.poetry]
name = "aion-bot"
version = "0.1.0"
description = "Telegram bot"
authors = ["KRONOS-FORTALEZA-IA <your-email@example.com>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "aion_bot" },
]

[tool.poetry.dependencies]
python = "^3.9"
python-telegram-bot = "21.6"

[tool.poetry.group.dev.dependencies]
black = "^24.1.0"
isort = "^5.13.0"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
flake8 = "^6.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
